services:
  apache:
    image: tugboatqa/alpine
    aliases: test
    http: true
    https: false
    commands:
      init:
        - echo "********** INIT **********"
        - apk add --no-cache --virtual .build-deps bash gcc musl-dev openssl go
        - wget -O go.tgz https://dl.google.com/go/go1.25.4.src.tar.gz
        - tar -C /usr/local -xzf go.tgz
        - cd /usr/local/go/src
        - ./make.bash

      update:
        - cd "${TUGBOAT_ROOT}/server" &&  go build -o server main.go && chmod +x server
      build:
        - echo "********** BUILD **********"
        - cat .tugboat/tugboat.txt | mail -s "[1] Tugboat Preview ${TUGBOAT_PREVIEW_ID}" tugboat@example.com
        - cat .tugboat/tugboat.txt | mail -s "[2] Tugboat Preview ${TUGBOAT_PREVIEW_ID}" tugboat@example.com
        - cat .tugboat/tugboat.txt
        - cd "${TUGBOAT_ROOT}/server" && ./server
